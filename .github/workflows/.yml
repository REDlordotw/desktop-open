name: Generate Snake Animation

on:
  # Запуск по расписанию (каждый день в полночь)
  schedule:
    - cron: "0 0 * * *"
  
  # Возможность запускать вручную
  workflow_dispatch:
  
  # Запуск при пуше в ветку main
  push:
    branches:
      - main

# Предоставляем права на запись в репозиторий
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Создаем директорию для файла, если её нет
      - name: Create assets directory
        run: mkdir -p .github/assets

      # 3. Генерируем SVG-файлы прямо в папки репозитория
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            .github/assets/snake.svg
            .github/assets/snake-dark.svg?palette=github-dark

      # 4. Коммитим и пушим изменения напрямую в ветку main
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/assets/snake.svg .github/assets/snake-dark.svg
          git diff --staged --quiet || (git commit -m "chore: update snake animation" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
